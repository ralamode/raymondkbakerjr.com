name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job raises what it needs. A fork PR must not be able to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA. A tag is mutable, so `@v4` is a promise the action's
# author can rewrite under us. See .github/SECURITY.md → Supply chain. Dependabot keeps the SHA and
# the trailing version comment in sync.
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same file the dev machine reads, so there is no "works on my machine" gap.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Documentation links
        run: pnpm docs:links

      # The jobs below arrive with the code they check, as tracked in docs/plan.md:
      #   M1-1  lint · typecheck · build · pnpm audit --prod --audit-level=high
      #   M1-5  audit:dist (zero client JS, byte budget, image dimensions) · e2e (axe-core,
      #         keyboard traversal, 320px overflow)
      # They are named here rather than silently absent: AGENTS.md → "Quality gates" is the one
      # list of what is checked, and it marks these as not yet active.

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan history, not just the tip. A secret removed in a later commit is still
          # published — docs/content-policy.md -> "The permanence rule".
          fetch-depth: 0

      # The upstream gitleaks-action is used instead by most projects. This runs the gitleaks
      # binary directly for two reasons: the action has been under a proprietary EULA since
      # v2.0.0 while the binary stays MIT, and the action requires a license key for
      # organization-owned repositories — a failure mode that would arrive silently if this
      # repo ever moved to an org. The binary is version-pinned and checksum-verified, which
      # SECURITY.md -> Supply chain requires of anything downloaded into CI.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        # --redact takes NoOptDefVal=100, so the bare flag redacts fully. A non-zero exit
        # on findings is already gitleaks' default.
        run: gitleaks git --redact --verbose
