name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job raises what it needs. A fork PR must not be able to write.
permissions:
  contents: read

env:
  # Astro reports anonymous build telemetry by default. This repo's position on analytics is that
  # there are none (README -> constraints); applying that to our own build rather than only to the
  # visitor's page is the consistent reading, and CI is where it would otherwise fire every push.
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA. A tag is mutable, so `@v4` is a promise the action's
# author can rewrite under us. See .github/SECURITY.md → Supply chain. Dependabot keeps the SHA and
# the trailing version comment in sync.
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same file the dev machine reads, so there is no "works on my machine" gap.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation links
        run: pnpm docs:links

      - name: Build
        run: pnpm build

      - name: Build-output assertions
        run: pnpm audit:dist

      - name: Install Chromium
        # Only Chromium, and only the browser this suite drives. `--with-deps` pulls the system
        # libraries the runner image does not ship. Not cached: the download is tens of seconds
        # against a cache that would need invalidating on every Playwright bump.
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility, keyboard and layout
        run: pnpm e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Production dependency advisories
        # Threshold is `critical`, not `high`, and AGENTS.md -> Quality gates says why: this site
        # ships zero runtime JavaScript, so a high advisory in the build toolchain cannot reach the
        # static artifact, and a gate that cries wolf is one people learn to bypass.
        run: pnpm audit:deps

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan history, not just the tip. A secret removed in a later commit is still
          # published — docs/content-policy.md -> "The permanence rule".
          fetch-depth: 0

      # The upstream gitleaks-action is used instead by most projects. This runs the gitleaks
      # binary directly for two reasons: the action has been under a proprietary EULA since
      # v2.0.0 while the binary stays MIT, and the action requires a license key for
      # organization-owned repositories — a failure mode that would arrive silently if this
      # repo ever moved to an org. The binary is version-pinned and checksum-verified, which
      # SECURITY.md -> Supply chain requires of anything downloaded into CI.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        # --redact takes NoOptDefVal=100, so the bare flag redacts fully. A non-zero exit
        # on findings is already gitleaks' default.
        run: gitleaks git --redact --verbose
